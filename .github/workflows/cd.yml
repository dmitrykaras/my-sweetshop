name: CD Pipeline

# Запускается только когда CI Pipeline успешно прошёл на main
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Имя образа в нижнем регистре (требование GHCR)
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: my-sweetshop/src/backend/MySweetShop.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/my-sweetshop-api:latest
            ghcr.io/${{ github.repository_owner }}/my-sweetshop-api:${{ github.sha }}

services:
  postgres:
    image: postgres:16
    container_name: candy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: candydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - candy_postgres_data:/var/lib/postgresql/data

volumes:
  candy_postgres_data: